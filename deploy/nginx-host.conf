# Option C: nginx installed directly on the VPS (no Docker).
# Serves the built site (the contents of dist/) from /var/www/intan-portfolio.
# Copy to /etc/nginx/sites-available/intan-portfolio, replace example.com with
# your domain, then enable it (see README). Certbot adds the HTTPS part for you.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/intan-portfolio;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Built JS/CSS (file names carry a content hash): cache for a year
    location ^~ /static/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /files/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
